# Mirror validation gate for the plugin distribution branches.
#
# Keep action majors conservative here for act_runner compatibility; GitHub's
# hosted runner uses newer action majors in the primary workflow. The actual
# FRAG tests and marketplace-launch handshake are intentionally equivalent.
name: validate-plugin

on:
  push:
    branches: [latest, stable]
  pull_request:
    branches: [latest, stable]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FRAG test dependencies
        working-directory: plugins/frag/src
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        working-directory: plugins/frag/src
        run: pytest -q

      - name: Marketplace MCP handshake in clean offline runtime
        run: |
          RUNTIME_DIR="$(mktemp -d)"
          python -m venv "$RUNTIME_DIR/venv"
          PIP_NO_INDEX=1 "$RUNTIME_DIR/venv/bin/python" plugins/frag/src/handshake_check.py

      - name: Validate plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugins/frag --strict

      - name: Validate marketplace catalog
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
