# Validation gate for the branches that can feed plugin installs.
#
# The repository default is `latest`, while `stable` remains the release
# track. Because plugin.json deliberately has no version field, Claude Code
# can resolve plugin updates from git commit SHAs. Both branches therefore
# need the same tests before bad startup code reaches an installed session.
name: validate-plugin

on:
  push:
    branches: [latest, stable]
  pull_request:
    branches: [latest, stable]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7 action releases use the current GitHub Actions Node runtime. Older
      # v4/v5 releases are forced from deprecated Node 20 onto Node 24 and
      # produce noisy compatibility warnings on current runners.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install FRAG test dependencies
        working-directory: plugins/frag/src
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        working-directory: plugins/frag/src
        run: pytest -q

      # This intentionally does NOT use the environment above. It creates a
      # brand-new Python runtime with no FRAG/MCP packages installed, disables
      # PyPI, then launches the exact scripts/frag-server command used by the
      # marketplace. A sandbox-sensitive pip/venv bootstrap regression fails
      # here instead of on a user's machine.
      - name: Marketplace MCP handshake in clean offline runtime
        run: |
          RUNTIME_DIR="$(mktemp -d)"
          python -m venv "$RUNTIME_DIR/venv"
          PIP_NO_INDEX=1 "$RUNTIME_DIR/venv/bin/python" plugins/frag/src/handshake_check.py

      - name: Validate plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugins/frag --strict

      - name: Validate marketplace catalog
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict

      - name: Shellcheck the installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh
